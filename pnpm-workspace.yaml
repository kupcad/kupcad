packages:
  - 'packages/*'
allowBuilds:
  esbuild: true
minimumReleaseAge: 4320
# The versions the packages share: a package's dev dependency on one is `catalog:`. A peer
# range stays the package's own, what a host may bring.
catalog:
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@testing-library/svelte': ^5.4.2
  '@types/node': ^26.6.5
  jsdom: ^30.1.3
  svelte: ^5.57.2
  svelte-check: ^4.7.7
  vite: ^8.3.5
  vitest: ^5.0.5
