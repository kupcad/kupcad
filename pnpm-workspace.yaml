packages:
  - 'packages/*'
allowBuilds:
  esbuild: true
  # vsce's signing tool: packaging the extension doesn't sign it
  '@vscode/vsce-sign': false
minimumReleaseAge: 4320
# The VS Code API's types are those of the oldest VS Code the extension runs on (its
# engines.vscode): they move with it, by hand, or vsce refuses the extension. `pnpm update
# --latest` leaves them, as Dependabot does.
updateConfig:
  ignoreDependencies:
    - '@types/vscode'
# parse5-parser-stream 8.1 (jsdom 31's) calls what parse5 8.1 added, but asks for parse5 ^8.0.0,
# so pnpm gave it the 8.0.1 another package (vsce) had locked, and every jsdom test failed on
# `tokenizer.flushCharacters is not a function`. Remove once its range asks for 8.1.
overrides:
  parse5-parser-stream>parse5: ^8.1.0
# The versions the packages share: a package's dev dependency on one is `catalog:`. A peer
# range stays the package's own, what a host may bring.
catalog:
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@testing-library/svelte': ^5.4.2
  '@types/node': ^26.6.6
  jsdom: ^31.0.0
  svelte: ^5.57.3
  svelte-check: ^4.7.8
  vite: ^8.3.6
  vitest: ^5.1.0
