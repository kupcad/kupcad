# GoReleaser (https://goreleaser.com), run by .github/workflows/release.yml on a version tag:
# builds the kupcad CLI for each target with Zig, archives each build with KupCAD's license and
# the third-party notices, and uploads the archives and their checksums to the tag's release.
# `goreleaser release --snapshot --clean` builds the same archives into dist/ without
# releasing anything.
version: 2
project_name: kupcad

builds:
  - id: kupcad
    builder: zig
    dir: core
    binary: kupcad
    # The mode CI tests release builds in (linux release-safe): safety checks stay on
    flags:
      - -Doptimize=ReleaseSafe
    targets:
      - x86_64-linux-gnu
      - aarch64-linux-gnu
      - x86_64-macos
      - aarch64-macos
      - x86_64-windows-gnu
      - aarch64-windows-gnu

archives:
  - id: kupcad
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - src: core/THIRD_PARTY_NOTICES.md
        strip_parent: true
      # The texts THIRD_PARTY_NOTICES.md points to, at the paths it gives
      - src: core/licenses/*
        dst: licenses
        strip_parent: true
      - src: core/vendor/manifold/LICENSE
        dst: licenses/manifold
        strip_parent: true
      - src: core/vendor/Clipper2/LICENSE
        dst: licenses/clipper2
        strip_parent: true
      - src: core/vendor/oneTBB/LICENSE.txt
        dst: licenses/onetbb
        strip_parent: true
      - src: core/vendor/oneTBB/third-party-programs.txt
        dst: licenses/onetbb
        strip_parent: true
      - src: core/vendor/draco/LICENSE
        dst: licenses/draco
        strip_parent: true
      - src: core/vendor/eigen/LICENSE
        dst: licenses/eigen
        strip_parent: true
      - src: core/vendor/eigen/LICENSES/*
        dst: licenses/eigen/LICENSES
        strip_parent: true
      - src: core/vendor/tatfi/LICENSE
        dst: licenses/tatfi
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  # A tag such as v0.2.0-rc.1 makes a pre-release
  prerelease: auto
