<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KupCAD Universal WASM Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    textarea {
      width: 100%;
      height: 150px;
      background: #2d2d2d;
      color: #fff;
      border: 1px solid #444;
      padding: 10px;
      font-family: monospace;
    }

    button {
      padding: 10px 20px;
      background: #007acc;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #005f9e;
    }

    pre {
      background: #000;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <h2>KupCAD WebAssembly Sandbox</h2>

  <textarea id="sourceCode">
# @param missing_var [Length] This variable doesn't exist
unused_var = 100
Box.new(x: -15)

def check_flow()
  return
  cube()
end
  </textarea>

  <button onclick="runLinter()">Run Linter (check_code_wasm)</button>
  <button onclick="runFormatter()">Run Formatter (format_code_wasm)</button>

  <h3>Output:</h3>
  <pre id="output">Loading WASM...</pre>

  <script>
    let wasmInstance = null;

    // 1. Allocate Shared Memory for Zig to orchestrate Web Workers (128MB)
    const sharedMemory = new WebAssembly.Memory({
      initial: 2048,
      maximum: 65536,
      shared: true
    });

    // 2. Exhaustive WASI Filesystem Mock to prevent Zig LinkErrors
    const wasiImports = {
      env: { memory: sharedMemory },
      wasi_snapshot_preview1: {
        args_get: () => 0, args_sizes_get: () => 0, environ_get: () => 0,
        environ_sizes_get: () => 0, clock_time_get: () => 0, clock_res_get: () => 0,
        fd_advise: () => 0, fd_allocate: () => 0, fd_close: () => 0,
        fd_datasync: () => 0, fd_fdstat_get: () => 0, fd_fdstat_set_flags: () => 0,
        fd_fdstat_set_rights: () => 0, fd_filestat_get: () => 0,
        fd_filestat_set_size: () => 0, fd_filestat_set_times: () => 0,
        fd_pread: () => 0, fd_prestat_dir_name: () => 0, fd_prestat_get: () => 0,
        fd_pwrite: () => 0, fd_read: () => 0, fd_readdir: () => 0,
        fd_renumber: () => 0, fd_seek: () => 0, fd_sync: () => 0,
        fd_tell: () => 0, fd_write: () => 0, path_create_directory: () => 0,
        path_filestat_get: () => 0, path_filestat_set_times: () => 0,
        path_link: () => 0, path_open: () => 0, path_readlink: () => 0,
        path_remove_directory: () => 0, path_rename: () => 0,
        path_symlink: () => 0, path_unlink_file: () => 0, poll_oneoff: () => 0,
        proc_exit: (rval) => console.log('WASI exit:', rval), proc_raise: () => 0,
        random_get: () => 0, sched_yield: () => 0, sock_recv: () => 0,
        sock_send: () => 0, sock_shutdown: () => 0
      }
    };

    WebAssembly.instantiateStreaming(fetch("/kupcad.wasm"), wasiImports)
      .then(result => {
        wasmInstance = result.instance;
        document.getElementById("output").innerText = "WASM Loaded Successfully! Ready.";
      })
      .catch(err => {
        document.getElementById("output").innerText = "Failed to load WASM: " + err;
        console.error(err);
      });

    // Helper to safely execute, read length, decode string, and FREE memory
    function executeWasmTask(funcName) {
      if (!wasmInstance) return alert("WASM not loaded yet!");

      const code = document.getElementById("sourceCode").value;
      const encodedArgs = new TextEncoder().encode(code);

      // FIX: Fallback to the injected sharedMemory if Zig didn't export it!
      const activeMemory = () => {
        return wasmInstance.exports.memory
          ? wasmInstance.exports.memory.buffer
          : sharedMemory.buffer;
      };

      // Allocate Input Buffer via wasm_alloc
      const inputPtr = wasmInstance.exports.wasm_alloc(encodedArgs.length);
      new Uint8Array(activeMemory()).set(encodedArgs, inputPtr);

      // Allocate Output Length Pointer (wasm32 uses 4-byte pointers)
      const outLenPtr = wasmInstance.exports.wasm_alloc(4);

      // Execute zig function natively
      const resultPtr = wasmInstance.exports[funcName](inputPtr, encodedArgs.length, outLenPtr);

      // Use DataView to safely read the unaligned 32-bit length integer
      const outLen = new DataView(activeMemory()).getUint32(outLenPtr, true);

      let outputText = "";
      if (resultPtr === 0) {
        // Read the null-terminated error string from Zig
        const errPtr = wasmInstance.exports.get_last_error();
        const mem = new Uint8Array(activeMemory());
        let endPtr = errPtr;
        while (mem[endPtr] !== 0) endPtr++;

        outputText = "Error: " + new TextDecoder().decode(mem.subarray(errPtr, endPtr));
      } else {
        // .slice() copies bytes into a non-shared ArrayBuffer so TextDecoder accepts it
        const rawBytes = new Uint8Array(activeMemory(), resultPtr, outLen).slice();
        outputText = new TextDecoder().decode(rawBytes);

        // PREVENT LEAK: Free the result string!
        wasmInstance.exports.wasm_free(resultPtr, outLen);
      }

      // PREVENT LEAK: Free Inputs and Length Pointer!
      wasmInstance.exports.wasm_free(inputPtr, encodedArgs.length);
      wasmInstance.exports.wasm_free(outLenPtr, 4);

      return outputText;
    }

    function runLinter() {
      const result = executeWasmTask("check_code_wasm");
      try {
        document.getElementById("output").innerText = JSON.stringify(JSON.parse(result), null, 2);
      } catch (e) {
        document.getElementById("output").innerText = result;
      }
    }

    function runFormatter() {
      document.getElementById("output").innerText = executeWasmTask("format_code_wasm");
    }
  </script>
</body>

</html>
