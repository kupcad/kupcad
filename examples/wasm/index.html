<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KupCAD WASM Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    textarea {
      width: 100%;
      height: 150px;
      background: #2d2d2d;
      color: #fff;
      border: 1px solid #444;
      padding: 10px;
      font-family: monospace;
    }

    button {
      padding: 10px 20px;
      background: #007acc;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #005f9e;
    }

    pre {
      background: #000;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <h2>KupCAD WebAssembly Linter Test</h2>

  <textarea id="sourceCode">
# @param missing_var [Length] This variable doesn't exist
unused_var = 100
Box.new(x: -15)

def check_flow()
  return
  cube()
end
    </textarea>

  <button onclick="runLinter()">Run Linter (check_code_wasm)</button>
  <button onclick="runFormatter()">Run Formatter (format_code_wasm)</button>

  <h3>Output:</h3>
  <pre id="output">Loading WASM...</pre>

  <script>
    let wasmInstance = null;

    // Minimal WASI import stub required for wasm32-wasi targets
    const wasiImports = {
      wasi_snapshot_preview1: {
        args_get: (argv, argv_buf) => 0,
        args_sizes_get: (pargc, pargv_buf_size) => 0,
        environ_get: (environ, environ_buf) => 0,
        environ_sizes_get: (penvironc, penviron_buf_size) => 0,
        clock_time_get: (clock_id, precision, ptime) => 0,
        fd_close: (fd) => 0,
        fd_fdstat_get: (fd, pbuf) => 0,
        fd_seek: (fd, offset, whence, newoffset) => 0,
        fd_write: (fd, iovs, iovs_len, pnwritten) => 0,
        proc_exit: (rval) => console.log('WASI exit:', rval),
        random_get: (buf, buf_len) => 0,
        sched_yield: () => 0,
      }
    };

    // Helper to read null-terminated C-strings from WASM memory
    function readCStr(ptr) {
      if (!ptr) return "";
      const memory = new Uint8Array(wasmInstance.exports.memory.buffer);
      let endPtr = ptr;
      while (endPtr < memory.length && memory[endPtr] !== 0) {
        endPtr++;
      }
      return new TextDecoder().decode(memory.subarray(ptr, endPtr));
    }

    // 1. Load and Instantiate the WebAssembly Module
    WebAssembly.instantiateStreaming(fetch("kupcad.wasm"), wasiImports)
      .then(result => {
        wasmInstance = result.instance;
        document.getElementById("output").innerText = "WASM Loaded Successfully! Ready to test.";
        console.log("WASM Exports:", wasmInstance.exports);
      })
      .catch(err => {
        document.getElementById("output").innerText = "Failed to load WASM: " + err;
        console.error(err);
      });

    function runLinter() {
      if (!wasmInstance) return alert("WASM not loaded yet!");
      const code = document.getElementById("sourceCode").value;

      const encoder = new TextEncoder();
      const encodedArgs = encoder.encode(code);

      // Allocate input buffer via wasm_alloc
      const ptr = wasmInstance.exports.wasm_alloc(encodedArgs.length);
      const memoryBefore = new Uint8Array(wasmInstance.exports.memory.buffer);
      memoryBefore.set(encodedArgs, ptr);

      // Run Linter
      const resultPtr = wasmInstance.exports.check_code_wasm(ptr, encodedArgs.length);

      // Read JSON output
      const jsonString = readCStr(resultPtr);

      // Free input buffer via wasm_free
      wasmInstance.exports.wasm_free(ptr, encodedArgs.length);

      if (!resultPtr) {
        const lastErr = readCStr(wasmInstance.exports.get_last_error());
        document.getElementById("output").innerText = "Linter Error: " + lastErr;
        return;
      }

      try {
        const diagnostics = JSON.parse(jsonString);
        document.getElementById("output").innerText = JSON.stringify(diagnostics, null, 2);
      } catch (e) {
        document.getElementById("output").innerText = "Error parsing JSON:\n" + jsonString;
      }
    }

    function runFormatter() {
      if (!wasmInstance) return alert("WASM not loaded yet!");
      const code = document.getElementById("sourceCode").value;

      const encoder = new TextEncoder();
      const encodedArgs = encoder.encode(code);

      // Allocate input buffer via wasm_alloc
      const ptr = wasmInstance.exports.wasm_alloc(encodedArgs.length);
      const memoryBefore = new Uint8Array(wasmInstance.exports.memory.buffer);
      memoryBefore.set(encodedArgs, ptr);

      // Run Formatter
      const resultPtr = wasmInstance.exports.format_code_wasm(ptr, encodedArgs.length);

      // Read Formatted String
      const formattedCode = readCStr(resultPtr);

      // Free input buffer via wasm_free
      wasmInstance.exports.wasm_free(ptr, encodedArgs.length);

      if (!resultPtr) {
        const lastErr = readCStr(wasmInstance.exports.get_last_error());
        document.getElementById("output").innerText = "Formatter Failed: " + lastErr;
        return;
      }

      document.getElementById("output").innerText = formattedCode;
    }
  </script>
</body>

</html>
