name: Release

# A version tag (v0.2.0, or v0.2.0-rc.1 for a pre-release) builds the kupcad CLI on a runner
# of each system and architecture it ships for, checks each binary runs there, and publishes
# them, packaged with their licenses (core/scripts/package-release.sh), as the tag's GitHub
# release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # `kupcad --version` reads build.zig.zon: a tag that says otherwise would release
      # binaries reporting another version
      - name: The tag is the version in build.zig.zon
        id: version
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' core/build.zig.zon)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but core/build.zig.zon has version $version: tag v$version, or change the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux binaries link the glibc they name, so they run on any distribution from
          # 2018 on, not only on ones as new as the runner's
          - platform: linux_amd64
            os: ubuntu-latest
            target: x86_64-linux-gnu.2.28
            binary: kupcad
          - platform: linux_arm64
            os: ubuntu-24.04-arm
            target: aarch64-linux-gnu.2.28
            binary: kupcad
          - platform: darwin_arm64
            os: macos-latest
            target: aarch64-macos
            binary: kupcad
          - platform: darwin_amd64
            os: macos-15-intel
            target: x86_64-macos
            binary: kupcad
          - platform: windows_amd64
            os: windows-latest
            target: x86_64-windows-gnu
            binary: kupcad.exe
          - platform: windows_arm64
            os: windows-11-arm
            target: aarch64-windows-gnu
            binary: kupcad.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          zig-version-file: .tool-versions

      # ReleaseSafe, the mode CI tests release builds in (linux release-safe): safety checks
      # stay on
      - name: Build
        working-directory: core
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -p ../out

      # The binary ships without its debug information, which goes in the release's symbols
      # archive for its platform, to turn a crash report's addresses into files and lines with
      # the exact build. Linux keeps it in the binary (82 MB of 95): it goes to kupcad.debug,
      # which the stripped binary names, so gdb and addr2line find it next to it. macOS leaves
      # it in the build's object files, which dsymutil gathers into kupcad.dSYM; Windows writes
      # kupcad.pdb beside the binary.
      - name: Keep the debug information apart
        run: |
          mkdir -p symbols
          case "$RUNNER_OS" in
            Linux)
              objcopy --only-keep-debug out/bin/kupcad symbols/kupcad.debug
              strip --strip-debug out/bin/kupcad
              (cd symbols && objcopy --add-gnu-debuglink=kupcad.debug ../out/bin/kupcad)
              ;;
            macOS) dsymutil out/bin/kupcad -o symbols/kupcad.dSYM ;;
            Windows) cp out/bin/kupcad.pdb symbols/ ;;
          esac

      # On the system it ships for, as it ships: it reports the tag's version and builds an
      # example
      - name: Run it
        working-directory: examples
        run: |
          kupcad=../out/bin/${{ matrix.binary }}
          test "$("$kupcad" --version)" = "kupcad ${{ needs.version.outputs.version }}"
          "$kupcad" build standoff.kup -o standoff.stl
          test -s standoff.stl

      - name: Keep the binary
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: out/bin/${{ matrix.binary }}
          if-no-files-found: error

      - name: Keep its symbols
        uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.platform }}
          path: symbols/
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The submodules hold the vendored libraries' license files the archives carry
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Collect the binaries and their symbols
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # A folder per platform, as package-release.sh takes them: the binary, and its symbols
      # in symbols/
      - name: Package them
        run: |
          mkdir binaries
          for dir in artifacts/release-*; do mv "$dir" "binaries/${dir#artifacts/release-}"; done
          for dir in artifacts/symbols-*; do mv "$dir" "binaries/${dir#artifacts/symbols-}/symbols"; done
          core/scripts/package-release.sh "${{ needs.version.outputs.version }}" binaries dist

      # A tag with a suffix (v0.2.0-rc.1) is a pre-release
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/kupcad_* dist/checksums.txt --title "$TAG" --generate-notes --verify-tag "${prerelease[@]}"
