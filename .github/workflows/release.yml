name: Release

# A version tag (v0.2.0, or v0.2.0-rc.1 for a pre-release) builds the kupcad CLI on a runner
# of each system and architecture it ships for, checks each binary runs there, builds the
# desktop app around it on each, and publishes them, the CLI packaged with its licenses
# (core/scripts/package-release.sh) and the app's installers beside it, with the updater's
# latest.json the installed apps update from, as the tag's GitHub release, each file attested
# (actions/attest-build-provenance). Once the release is out, the
# npm packages a site or a tool installs (@kupcad/playground and what it runs on, the core's
# module shrunk by wasm-opt among them) go to npm at the same version, with provenance.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # The packages published to npm as @kupcad/<name>, each after those it depends on
  NPM_PACKAGES: protocol wasm ui editor playground

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `kupcad --version` reads build.zig.zon: a tag that says otherwise would release
      # binaries reporting another version
      - name: The tag is the version in build.zig.zon
        id: version
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' core/build.zig.zon)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but core/build.zig.zon has version $version: tag v$version, or change the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The npm packages carry the core's version too (@kupcad/wasm's tests hold it to the
      # module's): a tag that says otherwise would publish them under another
      - name: The packages' versions are the tag's
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=0
          for name in $NPM_PACKAGES; do
            version=$(jq -r .version "packages/kupcad-$name/package.json")
            if [ "$version" != "$VERSION" ]; then
              echo "::error::packages/kupcad-$name/package.json has version $version, the tag $VERSION"
              status=1
            fi
          done
          exit $status

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux binaries link the glibc they name, so they run on any distribution from
          # 2018 on, not only on ones as new as the runner's
          - platform: linux_amd64
            os: ubuntu-latest
            target: x86_64-linux-gnu.2.28
            binary: kupcad
          - platform: linux_arm64
            os: ubuntu-24.04-arm
            target: aarch64-linux-gnu.2.28
            binary: kupcad
          - platform: darwin_arm64
            os: macos-latest
            target: aarch64-macos
            binary: kupcad
          - platform: darwin_amd64
            os: macos-15-intel
            target: x86_64-macos
            binary: kupcad
          - platform: windows_amd64
            os: windows-latest
            target: x86_64-windows-gnu
            binary: kupcad.exe
          - platform: windows_arm64
            os: windows-11-arm
            target: aarch64-windows-gnu
            binary: kupcad.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@7e5af686da64007a0797898801de180e5f4d3762 # v1.0.5
        with:
          zig-version-file: .tool-versions

      # ReleaseSafe, the mode CI tests release builds in (linux release-safe): safety checks
      # stay on
      - name: Build
        working-directory: core
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -p ../out

      # The binary ships without its debug information, which goes in the release's symbols
      # archive for its platform, to turn a crash report's addresses into files and lines with
      # the exact build. Linux keeps it in the binary (82 MB of 95): it goes to kupcad.debug,
      # which the stripped binary names, so gdb and addr2line find it next to it. macOS leaves
      # it in the build's object files, which dsymutil gathers into kupcad.dSYM; Windows writes
      # kupcad.pdb beside the binary.
      - name: Keep the debug information apart
        run: |
          mkdir -p symbols
          case "$RUNNER_OS" in
            Linux)
              objcopy --only-keep-debug out/bin/kupcad symbols/kupcad.debug
              strip --strip-debug out/bin/kupcad
              (cd symbols && objcopy --add-gnu-debuglink=kupcad.debug ../out/bin/kupcad)
              ;;
            macOS) dsymutil out/bin/kupcad -o symbols/kupcad.dSYM ;;
            Windows) cp out/bin/kupcad.pdb symbols/ ;;
          esac

      # On the system it ships for, as it ships: it reports the tag's version and builds an
      # example
      # The version comes in through the environment, never into the script's text
      - name: Run it
        working-directory: examples
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          kupcad=../out/bin/${{ matrix.binary }}
          test "$("$kupcad" --version)" = "kupcad $VERSION"
          "$kupcad" build standoff.kup -o standoff.stl
          test -s standoff.stl

      - name: Keep the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: out/bin/${{ matrix.binary }}
          if-no-files-found: error

      - name: Keep its symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-${{ matrix.platform }}
          path: symbols/
          if-no-files-found: error

  desktop:
    name: Build the desktop app ${{ matrix.platform }}
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on the oldest Ubuntu the runners have: the app links the glibc it is built
          # with, and an older one runs on more distributions
          - platform: linux_amd64
            os: ubuntu-22.04
            binary: kupcad
            bundles: deb,rpm,appimage
          - platform: linux_arm64
            os: ubuntu-22.04-arm
            binary: kupcad
            bundles: deb,rpm
          # The .app too: the updater's .app.tar.gz is made from it
          - platform: darwin_arm64
            os: macos-latest
            binary: kupcad
            bundles: app,dmg
          - platform: darwin_amd64
            os: macos-15-intel
            binary: kupcad
            bundles: app,dmg
          - platform: windows_amd64
            os: windows-latest
            binary: kupcad.exe
            bundles: nsis
          - platform: windows_arm64
            os: windows-11-arm
            binary: kupcad.exe
            bundles: nsis
    defaults:
      run:
        shell: bash
    environment:
      name: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: '^12.15'
          node-version-file: .tool-versions
          cache: true

      - name: Read the Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-25
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      # The webview and what the bundles need (Tauri's prerequisites for Linux)
      - name: Install the system's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      # The app bundles the CLI this release ships for its platform, built and checked above
      - name: Collect the kupcad built for this platform
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.platform }}
          path: cli

      - name: Bundle it as the app's kupcad
        run: |
          chmod +x "cli/${{ matrix.binary }}"
          pnpm install --frozen-lockfile --filter '@kupcad/desktop...'
          pnpm --filter @kupcad/desktop sidecar "$GITHUB_WORKSPACE/cli/${{ matrix.binary }}"

      # With what the updater installs, each signed with the release's key (a .sig beside it):
      # the .app.tar.gz, the AppImage, the .deb and .rpm, the NSIS installer. A build without the
      # key, `pnpm tauri build` on a machine, makes the installers alone
      - name: Build the installers
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          config="{\"version\": \"$VERSION\", \"bundle\": {\"createUpdaterArtifacts\": true}}"
          pnpm --filter @kupcad/desktop tauri build --bundles ${{ matrix.bundles }} --config "$config"

      # The kupcad the app runs is the release's: it reports the tag's version
      - name: Check the bundled kupcad
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          kupcad=packages/kupcad-desktop/src-tauri/target/release/${{ matrix.binary }}
          test "$("$kupcad" --version)" = "kupcad $VERSION"

      # Named as the release names its files: kupcad-desktop_<version>_<os>_<arch>, each
      # signature as its file (the release job writes them into latest.json)
      - name: Name the installers
        env:
          NAME: kupcad-desktop_${{ needs.version.outputs.version }}_${{ matrix.platform }}
        run: |
          shopt -s nullglob
          bundle=packages/kupcad-desktop/src-tauri/target/release/bundle
          mkdir desktop
          # `kept <file> <name>`: the file and its signature, if it has one
          kept() {
            cp "$1" "desktop/$2"
            if [ -f "$1.sig" ]; then cp "$1.sig" "desktop/$2.sig"; fi
          }
          for f in "$bundle"/dmg/*.dmg; do kept "$f" "$NAME.dmg"; done
          for f in "$bundle"/macos/*.app.tar.gz; do kept "$f" "$NAME.app.tar.gz"; done
          for f in "$bundle"/deb/*.deb; do kept "$f" "$NAME.deb"; done
          for f in "$bundle"/rpm/*.rpm; do kept "$f" "$NAME.rpm"; done
          for f in "$bundle"/appimage/*.AppImage; do kept "$f" "$NAME.AppImage"; done
          for f in "$bundle"/nsis/*-setup.exe; do kept "$f" "${NAME}_setup.exe"; done
          ls desktop
          # Every installer but a .dmg updates the app: each needs its signature
          for f in desktop/*; do
            case "$f" in *.sig | *.dmg) continue ;; esac
            test -f "$f.sig" || { echo "::error::$f has no signature"; exit 1; }
          done
          test -n "$(ls desktop)"

      - name: Keep the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop/
          if-no-files-found: error

  # The npm packages, built and packed beside the binaries; published only once the release is
  # out (the npm job)
  packages:
    name: Build the npm packages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: '^12.15'
          node-version-file: .tool-versions
          cache: true

      - name: Install Zig
        uses: xyzzylabs/setup-zig@7e5af686da64007a0797898801de180e5f4d3762 # v1.0.5
        with:
          zig-version-file: .tool-versions

      # Binaryen's own build, checked against the hash of the one this was written with
      - name: Install wasm-opt
        env:
          BINARYEN: version_133
          SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          archive="binaryen-$BINARYEN-x86_64-linux.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ReleaseSafe, as the binaries are
      - name: Build kupcad.wasm
        run: pnpm build:core:wasm

      # Only the features the module uses past Binaryen's defaults: --all-features let it write
      # what no engine reads yet (its imports compacted, which V8 refused as "unknown import
      # kind"). A module that comes to use another fails here, until it is added
      - name: Shrink it
        working-directory: core/zig-out/bin
        run: |
          wasm-opt --version
          wasm-opt -Oz --enable-bulk-memory-opt --enable-nontrapping-float-to-int kupcad.wasm -o kupcad.opt.wasm
          echo "kupcad.wasm: $(stat -c %s kupcad.wasm) bytes, $(stat -c %s kupcad.opt.wasm) shrunk"
          mv kupcad.opt.wasm kupcad.wasm

      - name: Copy it into @kupcad/wasm
        run: pnpm --filter @kupcad/wasm build

      # The packages that run the module, on the shrunk one: in Node, and the viewer and the
      # playground in headless Chromium as a site embeds them
      - name: Test them on it
        run: |
          pnpm --filter @kupcad/wasm --filter @kupcad/ui --filter @kupcad/playground test
          pnpm --filter @kupcad/playground exec playwright install --with-deps chromium
          pnpm --filter @kupcad/ui --filter @kupcad/playground test:browser

      # pnpm pack turns workspace:* into the version each is published at
      - name: Pack them
        run: |
          mkdir npm
          for name in $NPM_PACKAGES; do
            (cd "packages/kupcad-$name" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm")
          done
          ls -l npm

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm/
          if-no-files-found: error

  release:
    name: Publish the release
    # The packages too: a release whose packages can't ship waits for a tag that fixes them
    needs: [version, build, desktop, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The attestations: the job's OIDC token signs them, and they are stored with the repository
      id-token: write
      attestations: write
    steps:
      # The submodules hold the vendored libraries' license files the archives carry
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Collect the binaries and their symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # A folder per platform, as package-release.sh takes them: the binary, and its symbols
      # in symbols/
      - name: Package them
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir binaries
          for dir in artifacts/release-*; do mv "$dir" "binaries/${dir#artifacts/release-}"; done
          for dir in artifacts/symbols-*; do mv "$dir" "binaries/${dir#artifacts/symbols-}/symbols"; done
          core/scripts/package-release.sh "$VERSION" binaries dist

      # The desktop app's installers beside the CLI, their SHA-256 in the same checksums.txt, and
      # the updater's latest.json, which holds their signatures (so the .sig files aren't shipped):
      # the apps installed read it as the latest release's (tauri.conf.json's endpoint), so a
      # pre-release updates none
      - name: Add the desktop installers
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv artifacts/desktop-*/* dist/
          node packages/kupcad-desktop/scripts/updater-manifest.js "$VERSION" "$GITHUB_REPOSITORY" dist > dist/latest.json
          rm dist/*.sig
          (cd dist && sha256sum kupcad-desktop_* latest.json >> checksums.txt)

      # Each file the release ships attested as built by this workflow from the tag (a Sigstore
      # signature, kept with the repository): `gh attestation verify <file> --repo
      # kupcad/kupcad` checks one, as the VS Code extension does before it installs a kupcad.
      # checksums.txt comes from the release itself, so it catches a broken download only
      - name: Attest them
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kupcad_*
            dist/kupcad-desktop_*
            dist/latest.json
            dist/checksums.txt

      # A tag with a suffix (v0.2.0-rc.1) is a pre-release
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/kupcad_* dist/kupcad-desktop_* dist/latest.json dist/checksums.txt --title "$TAG" --generate-notes --verify-tag "${prerelease[@]}"

  # npm's trusted publishing: the job's OIDC token is the credential, which npm takes from this
  # workflow (release.yml) in the npm environment only, and signs each package's provenance.
  # It publishes what the packages job packed, running nothing of the repository's
  npm:
    name: Publish the npm packages
    needs: [version, packages, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # The Node (and so the npm, 11.5.1 or later for trusted publishing) the repository names
      - name: Checkout .tool-versions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .tool-versions
          sparse-checkout-cone-mode: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          registry-url: 'https://registry.npmjs.org'

      - name: Collect the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm

      # Each after those it depends on. A pre-release (0.2.0-rc.1) goes under the next tag, not
      # latest. One already on npm is skipped, so a run stopped halfway can be re-run. The path
      # starts with ./: npm reads `npm/<file>.tgz` as the GitHub repository npm/<file>.tgz
      - name: Publish them
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm --version
          tag=latest
          if [[ $VERSION == *-* ]]; then tag=next; fi
          for name in $NPM_PACKAGES; do
            if [ "$(npm view "@kupcad/$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "@kupcad/$name@$VERSION is on npm already"
              continue
            fi
            npm publish "./npm/kupcad-$name-$VERSION.tgz" --provenance --access public --tag "$tag"
          done
