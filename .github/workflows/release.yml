name: Release

# A version tag (v0.2.0, or v0.2.0-rc.1 for a pre-release) builds the kupcad CLI on a runner
# of each system and architecture it ships for, checks each binary runs there, builds the
# desktop app around it on each, and publishes them, the CLI packaged with its licenses
# (core/scripts/package-release.sh) and the app's installers beside it, with the updater's
# latest.json the installed apps update from, as the tag's GitHub release, each file attested
# (actions/attest-build-provenance). Once the release is out, the
# npm packages a site or a tool installs (@kupcad/playground and what it runs on, the core's
# module shrunk by wasm-opt among them, and @kupcad/files, the browser IDE's tree) go to npm at the same version, with provenance,
# and the VS Code extension, its .vsix on the release too, to the Visual Studio Marketplace.
# libkupcad, the core as a C library, is built beside the CLI on each runner, and the Ruby gem
# and the Python wheel of each platform around it (bindings/), each tested on its platform, go
# to RubyGems.org and PyPI.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # The packages published to npm as @kupcad/<name>, each after those it depends on
  NPM_PACKAGES: protocol wasm ui editor playground files

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      # Every file that carries the version has the tag's (scripts/version.js lists them): the
      # core's build.zig.zon, which `kupcad --version` reads, the npm packages' (@kupcad/wasm's
      # tests hold it to the module's), the VS Code extension's, the desktop app's, the Ruby gem's
      # and the Python package's. A tag that says otherwise would release them under another.
      - name: The tag is the version of the core, its packages and its bindings
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          node scripts/version.js check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux binaries link the glibc they name, so they run on any distribution from
          # 2018 on, not only on ones as new as the runner's
          - platform: linux_amd64
            os: ubuntu-latest
            target: x86_64-linux-gnu.2.28
            binary: kupcad
            library: libkupcad.so
          - platform: linux_arm64
            os: ubuntu-24.04-arm
            target: aarch64-linux-gnu.2.28
            binary: kupcad
            library: libkupcad.so
          - platform: darwin_arm64
            os: macos-latest
            target: aarch64-macos
            binary: kupcad
            library: libkupcad.dylib
          - platform: darwin_amd64
            os: macos-15-intel
            target: x86_64-macos
            binary: kupcad
            library: libkupcad.dylib
          - platform: windows_amd64
            os: windows-latest
            target: x86_64-windows-gnu
            binary: kupcad.exe
            library: kupcad.dll
          - platform: windows_arm64
            os: windows-11-arm
            target: aarch64-windows-gnu
            binary: kupcad.exe
            library: kupcad.dll
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@2082e552e19803253444ed0f0124948d16e9a926 # v1.0.6
        with:
          zig-version-file: .tool-versions

      # ReleaseSafe, the mode CI tests release builds in (linux release-safe): safety checks
      # stay on
      - name: Build
        working-directory: core
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -p ../out

      # libkupcad, the core as a C library (core/include/kupcad.h), for this platform's Ruby
      # gem and Python wheel (the bindings job), into out/lib
      - name: Build libkupcad
        working-directory: core
        run: zig build lib -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -p ../out

      # The binary ships without its debug information, which goes in the release's symbols
      # archive for its platform, to turn a crash report's addresses into files and lines with
      # the exact build. Linux keeps it in the binary (82 MB of 95): it goes to kupcad.debug,
      # which the stripped binary names, so gdb and addr2line find it next to it. macOS leaves
      # it in the build's object files, which dsymutil gathers into kupcad.dSYM; Windows writes
      # kupcad.pdb beside the binary. libkupcad's goes the same way, into symbols/lib/.
      - name: Keep the debug information apart
        run: |
          mkdir -p symbols/lib
          case "$RUNNER_OS" in
            Linux)
              objcopy --only-keep-debug out/bin/kupcad symbols/kupcad.debug
              strip --strip-debug out/bin/kupcad
              (cd symbols && objcopy --add-gnu-debuglink=kupcad.debug ../out/bin/kupcad)
              objcopy --only-keep-debug out/lib/libkupcad.so symbols/lib/libkupcad.so.debug
              strip --strip-debug out/lib/libkupcad.so
              (cd symbols/lib && objcopy --add-gnu-debuglink=libkupcad.so.debug ../../out/lib/libkupcad.so)
              ;;
            macOS)
              dsymutil out/bin/kupcad -o symbols/kupcad.dSYM
              dsymutil out/lib/libkupcad.dylib -o symbols/lib/libkupcad.dylib.dSYM
              ;;
            Windows)
              cp out/bin/kupcad.pdb symbols/
              cp out/lib/kupcad.pdb symbols/lib/
              ;;
          esac

      # On the system it ships for, as it ships: it reports the tag's version and builds an
      # example
      # The version comes in through the environment, never into the script's text
      - name: Run it
        working-directory: examples
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          kupcad=../out/bin/${{ matrix.binary }}
          test "$("$kupcad" --version)" = "kupcad $VERSION"
          "$kupcad" build standoff.kup -o standoff.stl
          test -s standoff.stl

      - name: Keep the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: out/bin/${{ matrix.binary }}
          if-no-files-found: error

      - name: Keep its symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symbols-${{ matrix.platform }}
          path: symbols/
          if-no-files-found: error

      # With the notices and the license texts of what it is built from, which its gem and its
      # wheel carry beside it
      - name: Keep libkupcad
        run: core/scripts/collect-licenses.sh out/lib

      - name: Upload libkupcad
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libkupcad-${{ matrix.platform }}
          path: |
            out/lib/${{ matrix.library }}
            out/lib/THIRD_PARTY_NOTICES.md
            out/lib/licenses/
          if-no-files-found: error

  desktop:
    name: Build the desktop app ${{ matrix.platform }}
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on the oldest Ubuntu the runners have: the app links the glibc it is built
          # with, and an older one runs on more distributions
          - platform: linux_amd64
            os: ubuntu-22.04
            binary: kupcad
            bundles: deb,rpm,appimage
          - platform: linux_arm64
            os: ubuntu-22.04-arm
            binary: kupcad
            bundles: deb,rpm
          # The .app too: the updater's .app.tar.gz is made from it
          - platform: darwin_arm64
            os: macos-latest
            binary: kupcad
            bundles: app,dmg
          - platform: darwin_amd64
            os: macos-15-intel
            binary: kupcad
            bundles: app,dmg
          - platform: windows_amd64
            os: windows-latest
            binary: kupcad.exe
            bundles: nsis
          - platform: windows_arm64
            os: windows-11-arm
            binary: kupcad.exe
            bundles: nsis
    defaults:
      run:
        shell: bash
    environment:
      name: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: '^12.15'
          node-version-file: .tool-versions
          cache: true

      - name: Read the Rust version
        id: rust
        run: echo "version=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-25
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      # The webview and what the bundles need (Tauri's prerequisites for Linux)
      - name: Install the system's libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file

      # The app bundles the CLI this release ships for its platform, built and checked above
      - name: Collect the kupcad built for this platform
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.platform }}
          path: cli

      - name: Bundle it as the app's kupcad
        run: |
          chmod +x "cli/${{ matrix.binary }}"
          pnpm install --frozen-lockfile --filter '@kupcad/desktop...'
          pnpm --filter @kupcad/desktop sidecar "$GITHUB_WORKSPACE/cli/${{ matrix.binary }}"

      # With what the updater installs, each signed with the release's key (a .sig beside it):
      # the .app.tar.gz, the AppImage, the .deb and .rpm, the NSIS installer. A build without the
      # key, `pnpm tauri build` on a machine, makes the installers alone
      - name: Build the installers
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          config="{\"version\": \"$VERSION\", \"bundle\": {\"createUpdaterArtifacts\": true}}"
          pnpm --filter @kupcad/desktop tauri build --bundles ${{ matrix.bundles }} --config "$config"

      # The kupcad the app runs is the release's: it reports the tag's version
      - name: Check the bundled kupcad
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          kupcad=packages/kupcad-desktop/src-tauri/target/release/${{ matrix.binary }}
          test "$("$kupcad" --version)" = "kupcad $VERSION"

      # Named as the release names its files: kupcad-desktop_<version>_<os>_<arch>, each
      # signature as its file (the release job writes them into latest.json)
      - name: Name the installers
        env:
          NAME: kupcad-desktop_${{ needs.version.outputs.version }}_${{ matrix.platform }}
        run: |
          shopt -s nullglob
          bundle=packages/kupcad-desktop/src-tauri/target/release/bundle
          mkdir desktop
          # `kept <file> <name>`: the file and its signature, if it has one
          kept() {
            cp "$1" "desktop/$2"
            if [ -f "$1.sig" ]; then cp "$1.sig" "desktop/$2.sig"; fi
          }
          for f in "$bundle"/dmg/*.dmg; do kept "$f" "$NAME.dmg"; done
          for f in "$bundle"/macos/*.app.tar.gz; do kept "$f" "$NAME.app.tar.gz"; done
          for f in "$bundle"/deb/*.deb; do kept "$f" "$NAME.deb"; done
          for f in "$bundle"/rpm/*.rpm; do kept "$f" "$NAME.rpm"; done
          for f in "$bundle"/appimage/*.AppImage; do kept "$f" "$NAME.AppImage"; done
          for f in "$bundle"/nsis/*-setup.exe; do kept "$f" "${NAME}_setup.exe"; done
          ls desktop
          # Every installer but a .dmg updates the app: each needs its signature
          for f in desktop/*; do
            case "$f" in *.sig | *.dmg) continue ;; esac
            test -f "$f.sig" || { echo "::error::$f has no signature"; exit 1; }
          done
          test -n "$(ls desktop)"

      - name: Keep the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop/
          if-no-files-found: error

  # The npm packages, built and packed beside the binaries; published only once the release is
  # out (the npm job)
  packages:
    name: Build the npm packages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: '^12.15'
          node-version-file: .tool-versions
          cache: true

      - name: Install Zig
        uses: xyzzylabs/setup-zig@2082e552e19803253444ed0f0124948d16e9a926 # v1.0.6
        with:
          zig-version-file: .tool-versions

      # Binaryen's own build, checked against the hash of the one this was written with
      - name: Install wasm-opt
        env:
          BINARYEN: version_133
          SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          archive="binaryen-$BINARYEN-x86_64-linux.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ReleaseSafe, as the binaries are
      - name: Build kupcad.wasm
        run: pnpm build:core:wasm

      # Only the features the module uses past Binaryen's defaults: --all-features let it write
      # what no engine reads yet (its imports compacted, which V8 refused as "unknown import
      # kind"). A module that comes to use another fails here, until it is added
      - name: Shrink it
        working-directory: core/zig-out/bin
        run: |
          wasm-opt --version
          wasm-opt -Oz --enable-bulk-memory-opt --enable-nontrapping-float-to-int kupcad.wasm -o kupcad.opt.wasm
          echo "kupcad.wasm: $(stat -c %s kupcad.wasm) bytes, $(stat -c %s kupcad.opt.wasm) shrunk"
          mv kupcad.opt.wasm kupcad.wasm

      - name: Copy it into @kupcad/wasm
        run: pnpm --filter @kupcad/wasm build

      # The packages that run the module, on the shrunk one: in Node, and the viewer and the
      # playground in headless Chromium as a site embeds them
      - name: Test them on it
        run: |
          pnpm --filter @kupcad/wasm --filter @kupcad/ui --filter @kupcad/playground --filter @kupcad/files test
          pnpm --filter @kupcad/playground exec playwright install --with-deps chromium
          pnpm --filter @kupcad/ui --filter @kupcad/playground test:browser

      # pnpm pack turns workspace:* into the version each is published at
      - name: Pack them
        run: |
          mkdir npm
          for name in $NPM_PACKAGES; do
            (cd "packages/kupcad-$name" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm")
          done
          ls -l npm

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm/
          if-no-files-found: error

  # The VS Code extension, tested and packed beside the binaries; published only once the
  # release is out (the marketplace job). It ships no kupcad: it downloads the release's
  vscode:
    name: Build the VS Code extension
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: '^12.15'
          node-version-file: .tool-versions
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter 'kupcad-vscode...'

      - name: Test it
        run: pnpm --filter kupcad-vscode test

      # kupcad-vscode-<version>.vsix, packed by vsce from the bundles alone (--no-dependencies: the
      # build bundles what it runs)
      - name: Build and pack it
        run: |
          pnpm --filter kupcad-vscode build
          pnpm --filter kupcad-vscode package

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-extension
          path: packages/kupcad-vscode/kupcad-vscode-${{ needs.version.outputs.version }}.vsix
          if-no-files-found: error

  # The Ruby gem and the Python wheel of each platform, around the libkupcad built for it
  # (bindings/): packed, then installed as a user installs them and their tests run against
  # them, there. Published once the release is out (the rubygems and pypi jobs)
  bindings:
    name: Build the gem and the wheel for ${{ matrix.platform }}
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux_amd64
            os: ubuntu-latest
            library: libkupcad.so
            gem: x86_64-linux-gnu
            wheel: manylinux_2_28_x86_64
          - platform: linux_arm64
            os: ubuntu-24.04-arm
            library: libkupcad.so
            gem: aarch64-linux-gnu
            wheel: manylinux_2_28_aarch64
          # A macOS wheel's tag names the oldest macOS it runs on: the build step reads it
          - platform: darwin_arm64
            os: macos-latest
            library: libkupcad.dylib
            gem: arm64-darwin
            wheel: arm64
          - platform: darwin_amd64
            os: macos-15-intel
            library: libkupcad.dylib
            gem: x86_64-darwin
            wheel: x86_64
          - platform: windows_amd64
            os: windows-latest
            library: kupcad.dll
            gem: x64-mingw-ucrt
            wheel: win_amd64
          - platform: windows_arm64
            os: windows-11-arm
            library: kupcad.dll
            gem: aarch64-mingw-ucrt
            wheel: win_arm64
    defaults:
      run:
        shell: bash
    env:
      LIBRARY: ${{ github.workspace }}/lib/${{ matrix.library }}
    steps:
      # The bindings' LICENSE is a link to the repository's: Git on Windows checks a link out as
      # a file holding its target, unless told to make links
      - name: Check links out as links
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The library, with the notices and the license texts beside it
      - name: Collect libkupcad
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libkupcad-${{ matrix.platform }}
          path: lib

      - name: Install Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          working-directory: bindings/ruby
          bundler-cache: true

      - name: Pack the gem
        working-directory: bindings/ruby
        env:
          GEM: ${{ matrix.gem }}
        run: bundle exec rake native:gem PLATFORM="$GEM" LIBRARY="$LIBRARY"

      # Outside Bundler, and the specs run against it and the library it carries
      - name: Test the installed gem
        working-directory: bindings/ruby
        run: |
          gem install --no-document pkg/kupcad-*.gem rspec
          KUPCAD_INSTALLED_GEM=1 ruby -S rspec

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .tool-versions

      # The wheel's platform tag: on macOS, the oldest macOS the library runs on, as Zig built
      # it (its minos), which a tag names by its major version
      - name: Build the wheel
        working-directory: bindings/python
        env:
          WHEEL: ${{ matrix.wheel }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            major=$(vtool -show-build "$LIBRARY" | awk '/minos/ { split($2, version, "."); print version[1] }')
            WHEEL="macosx_${major}_0_$WHEEL"
          fi
          python -m pip install --group dev
          KUPCAD_LIBRARY="$LIBRARY" KUPCAD_WHEEL_PLATFORM="$WHEEL" python -m build --wheel

      # The tests run against it and the library it carries, not the checkout's sources
      - name: Test the installed wheel
        working-directory: bindings/python
        run: |
          python -m pip install dist/*.whl
          cd tests
          KUPCAD_INSTALLED_WHEEL=1 python -m pytest -p no:cacheprovider .

      - name: Keep the gem
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-${{ matrix.gem }}
          path: bindings/ruby/pkg/*.gem
          if-no-files-found: error

      - name: Keep the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  release:
    name: Publish the release
    # The packages too: a release whose packages can't ship waits for a tag that fixes them
    needs: [version, build, desktop, packages, vscode, bindings]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The attestations: the job's OIDC token signs them, and they are stored with the repository
      id-token: write
      attestations: write
    steps:
      # The submodules hold the vendored libraries' license files the archives carry
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Collect the binaries and their symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # A folder per platform, as package-release.sh takes them: the binary, and its symbols
      # in symbols/
      - name: Package them
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir binaries
          for dir in artifacts/release-*; do mv "$dir" "binaries/${dir#artifacts/release-}"; done
          for dir in artifacts/symbols-*; do mv "$dir" "binaries/${dir#artifacts/symbols-}/symbols"; done
          core/scripts/package-release.sh "$VERSION" binaries dist

      # The desktop app's installers beside the CLI, their SHA-256 in the same checksums.txt, and
      # the updater's latest.json, which holds their signatures (so the .sig files aren't shipped):
      # the apps installed read it as the latest release's (tauri.conf.json's endpoint), so a
      # pre-release updates none
      - name: Add the desktop installers
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mv artifacts/desktop-*/* dist/
          node packages/kupcad-desktop/scripts/updater-manifest.js "$VERSION" "$GITHUB_REPOSITORY" dist > dist/latest.json
          rm dist/*.sig
          (cd dist && sha256sum kupcad-desktop_* latest.json >> checksums.txt)

      # The VS Code extension the Marketplace gets, for an editor that installs one from a file
      # (VSCodium, Cursor), and a pre-release's, which the Marketplace doesn't take
      - name: Add the VS Code extension
        run: |
          mv artifacts/vscode-extension/*.vsix dist/
          (cd dist && sha256sum *.vsix >> checksums.txt)

      # Each file the release ships attested as built by this workflow from the tag (a Sigstore
      # signature, kept with the repository): `gh attestation verify <file> --repo
      # kupcad/kupcad` checks one, as the VS Code extension does before it installs a kupcad.
      # checksums.txt comes from the release itself, so it catches a broken download only
      - name: Attest them
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kupcad_*
            dist/kupcad-desktop_*
            dist/*.vsix
            dist/latest.json
            dist/checksums.txt

      # A tag with a suffix (v0.2.0-rc.1) is a pre-release
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/kupcad_* dist/kupcad-desktop_* dist/*.vsix dist/latest.json dist/checksums.txt --title "$TAG" --generate-notes --verify-tag "${prerelease[@]}"

  # npm's trusted publishing: the job's OIDC token is the credential, which npm takes from this
  # workflow (release.yml) in the npm environment only, and signs each package's provenance.
  # It publishes what the packages job packed, running nothing of the repository's
  npm:
    name: Publish the npm packages
    needs: [version, packages, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # The Node (and so the npm, 11.5.1 or later for trusted publishing) the repository names
      - name: Checkout .tool-versions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .tool-versions
          sparse-checkout-cone-mode: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          registry-url: 'https://registry.npmjs.org'

      - name: Collect the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm

      # Each after those it depends on. A pre-release (0.2.0-rc.1) goes under the next tag, not
      # latest. One already on npm is skipped, so a run stopped halfway can be re-run. The path
      # starts with ./: npm reads `npm/<file>.tgz` as the GitHub repository npm/<file>.tgz
      - name: Publish them
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm --version
          tag=latest
          if [[ $VERSION == *-* ]]; then tag=next; fi
          for name in $NPM_PACKAGES; do
            if [ "$(npm view "@kupcad/$name@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "@kupcad/$name@$VERSION is on npm already"
              continue
            fi
            npm publish "./npm/kupcad-$name-$VERSION.tgz" --provenance --access public --tag "$tag"
          done

  # The Visual Studio Marketplace's trusted publishing: the job's OIDC token is the credential,
  # which the Marketplace takes from this workflow (release.yml) in the vscode environment only.
  # It publishes what the vscode job packed, with the vsce the extension packs with, running
  # nothing of the repository's. The Marketplace has no semver pre-releases (0.2.0-rc.1), so a
  # pre-release tag publishes nothing there: its .vsix is on the GitHub release
  marketplace:
    name: Publish the VS Code extension
    needs: [version, vscode, release]
    if: ${{ !contains(needs.version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vscode
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout .tool-versions and the extension's package.json
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .tool-versions
            packages/kupcad-vscode/package.json
          sparse-checkout-cone-mode: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Collect the extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vscode-extension
          path: vsix

      # The version already on the Marketplace is skipped, so a run stopped halfway can be re-run
      - name: Publish it
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          vsce=$(jq -r '.devDependencies["@vscode/vsce"]' packages/kupcad-vscode/package.json)
          npx --yes "@vscode/vsce@$vsce" publish --oidc --packagePath "vsix/kupcad-vscode-$VERSION.vsix" --skip-duplicate

  # RubyGems.org's trusted publishing: the job's OIDC token is the credential, which RubyGems
  # takes from this workflow (release.yml) in the rubygems environment only. It pushes what the
  # bindings job packed, running nothing of the repository's; a gem already there is skipped, so a
  # run stopped halfway can be re-run
  rubygems:
    name: Publish the Ruby gems
    needs: [version, bindings, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      # The Ruby the gem is developed with
      - name: Checkout bindings/ruby/.tool-versions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: bindings/ruby/.tool-versions
          sparse-checkout-cone-mode: false

      - name: Install Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          working-directory: bindings/ruby

      - name: Collect the gems
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true

      # The job's OIDC token exchanged for an API key that pushes for 15 minutes, as
      # rubygems/configure-rubygems-credentials does, but naming the account that owns the gem:
      # RubyGems.org lets a pending publisher create a gem only for the account the exchange
      # names, and the action sends the token alone
      - name: Get an API key for the trusted publisher
        # bash's pipefail: a curl that fails in a pipe fails the step
        shell: bash
        env:
          # The RubyGems.org account that owns the gem, by its ID (a handle can change)
          OWNER: '48301'
        run: |
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -er .value)
          if ! response=$(jq -n --arg jwt "$jwt" --arg owner "$OWNER" '{$jwt, $owner}' | curl --fail-with-body -sS -H 'Content-Type: application/json' -H 'Accept: application/json' --data @- https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token); then
            echo "RubyGems.org refused the token: $response" >&2
            exit 1
          fi
          key=$(jq -er .rubygems_api_key <<< "$response")
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Push them
        run: |
          ls -l pkg
          published=$(curl -fsS https://rubygems.org/api/v1/versions/kupcad.json | jq -r '.[] | "kupcad-\(.number)-\(.platform).gem"' || true)
          for gem in pkg/*.gem; do
            if grep -qxF "$(basename "$gem")" <<< "$published"; then
              echo "$(basename "$gem") is on RubyGems.org already"
              continue
            fi
            gem push "$gem"
          done

  # PyPI's trusted publishing: the job's OIDC token is the credential, which PyPI takes from this
  # workflow (release.yml) in the pypi environment only, and attests each wheel. It uploads what
  # the bindings job built, running nothing of the repository's; a wheel already there is skipped,
  # so a run stopped halfway can be re-run
  pypi:
    name: Publish the Python wheels
    needs: [version, bindings, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Collect the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish them
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
