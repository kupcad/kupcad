name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    # The front end (lexer, parser, linter, compiler, formatter) and the runtime (the VM and
    # the built-ins, on scripts that compile), each on random bytes from the corpus in
    # core/src/frontend/fuzz_corpus.zig and on generated programs (fuzz_program.zig), the
    # parsers of what KupCAD reads but didn't write (importers_fuzz_test.zig), and the JSON
    # files scripts read (stdlib/json_fuzz_test.zig, from json_fuzz_corpus/). A plain test run
    # replays the corpus on every platform; searching runs here, one job per target.
    name: Fuzz the ${{ matrix.target }} (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Each about 75 to 85 minutes on a hosted runner, from the run counts' measured times
        # (a test runs past its limit by a batch: twice it for front-end bytes, a tenth more
        # for generated programs, which cost about ten times as much a run).
        include:
          - target: frontend
            runs: 3M
          - target: runtime
            runs: 3M
          - target: frontend_programs
            runs: 400K
          - target: runtime_programs
            runs: 500K
          # Eight parsers of files and responses, each run to the limit: 1M took 27 minutes
          # on a hosted runner, build included (2026-10-19), so this is about 75.
          - target: importers
            runs: 3M
          # A VM per input, which reads it twice and copies it with to_h: 1.7 ms a run on
          # an M-series Mac (200K in 6 minutes, 2026-10-19), so this is about 45 there and
          # within the 75 or so the others take on a slower hosted runner.
          - target: json
            runs: 1500K
          # A font file a script imports, through tatfi and text's outlines and kerning, from
          # small TrueType and CFF seeds (src/core/test_fonts).
          - target: fonts
            runs: 1500K
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          zig-version-file: .tool-versions

      # The fuzzer's corpus (Zig's cache f/ directory): each night goes on from the inputs the
      # last one found. setup-zig's cache, which holds it too, is cleared whenever the build
      # outgrows its limit, and every night started over from the seeds. A failed job saves
      # nothing, so a crashing input isn't carried on.
      - name: Restore the fuzz corpus
        uses: actions/cache@v6
        with:
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/f
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        working-directory: core
        # A crash `--fuzz` finds is reported but leaves the exit code 0 (Zig 0.17 counts only
        # the steps before fuzzing), so the input it saves is what fails the job. One the cache
        # brought back is an earlier run's, so it goes first.
        run: |
          crash="${ZIG_LOCAL_CACHE_DIR:?}/f/crash"
          rm -f "$crash"
          zig build fuzz -Dfuzz-target=${{ matrix.target }} --fuzz=${{ matrix.runs }}
          if [ -e "$crash" ]; then
            echo "::error::The fuzzer found a crash; its input is in the fuzz-crash-${{ matrix.target }} artifact"
            exit 1
          fi

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          # setup-zig points Zig's cache at the checkout's root, not core/.
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/f/
          if-no-files-found: ignore

  release-fast:
    # Every test built ReleaseFast, which compiles out the safety checks the pull-request
    # tests keep (Debug and ReleaseSafe): code that is right only while they run, such as
    # undefined behaviour a check would have stopped, fails here.
    name: Tests in ReleaseFast (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          zig-version-file: .tool-versions

      - name: Setup `wasmtime`
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Run the tests
        working-directory: core
        run: zig build test -Doptimize=fast --summary line

      - name: Run the wasm tests
        if: ${{ !cancelled() }}
        working-directory: core
        run: zig build test-wasm -Dtarget=wasm32-wasi -Doptimize=fast --summary line

  gc-stress:
    # Every test with every VM collecting at each object allocation: a value a native or
    # the VM forgot to root is swept at once and the test fails where it is used.
    name: Tests under GC stress (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          zig-version-file: .tool-versions

      - name: Setup `wasmtime`
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Run the tests
        working-directory: core
        run: zig build test -Doptimize=debug -Dgc-stress --summary line

      - name: Run the wasm tests (32-bit pointers)
        working-directory: core
        run: zig build test-wasm -Dtarget=wasm32-wasi -Doptimize=debug -Dgc-stress --summary line

      # The threads build (shared memory, atomics) runs only here: its no-op std::mutex
      # (src/wasm_stubs.h) relies on Manifold staying serial in it.
      - name: Run the wasm tests (threads build)
        if: ${{ !cancelled() }}
        working-directory: core
        run: zig build test-wasm -Dtarget=wasm32-wasi -Doptimize=debug -Dwasm_threads=true --summary line
