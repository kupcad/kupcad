name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    # On generated input, from the corpus in core/src/frontend/fuzz_corpus.zig: the front
    # end (lexer, parser, linter, compiler, formatter), and the runtime (the VM and the
    # built-ins, on scripts that compile). A plain test run replays the corpus on every
    # platform; searching from it runs here, one job per fuzz test so each has the time.
    name: Fuzz the ${{ matrix.target }} (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: frontend
            runs: 2M
          # A runtime run sets up a VM, so it costs several front-end ones.
          - target: runtime
            runs: 500K
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          zig-version-file: .tool-versions

      - name: Fuzz
        working-directory: core
        run: zig build fuzz -Dfuzz-target=${{ matrix.target }} --fuzz=${{ matrix.runs }}

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          # setup-zig points Zig's cache at the checkout's root, not core/.
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/f/
          if-no-files-found: ignore

  gc-stress:
    # Every test with every VM collecting at each object allocation: a value a native or
    # the VM forgot to root is swept at once and the test fails where it is used.
    name: Tests under GC stress (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          zig-version-file: .tool-versions

      - name: Setup `wasmtime`
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Run the tests
        working-directory: core
        run: zig build test -Doptimize=debug -Dgc-stress --summary line

      - name: Run the wasm tests (32-bit pointers)
        working-directory: core
        run: zig build test-wasm -Dtarget=wasm32-wasi -Doptimize=debug -Dgc-stress --summary line

      # The threads build (shared memory, atomics) runs only here: its no-op std::mutex
      # (src/wasm_stubs.h) relies on Manifold staying serial in it.
      - name: Run the wasm tests (threads build)
        if: ${{ !cancelled() }}
        working-directory: core
        run: zig build test-wasm -Dtarget=wasm32-wasi -Doptimize=debug -Dwasm_threads=true --summary line
