name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    # The front end (lexer, parser, linter, compiler, formatter) and the runtime (the VM and
    # the built-ins, on scripts that compile), each on random bytes from the corpus in
    # core/src/frontend/fuzz_corpus.zig and on generated programs (fuzz_program.zig). A plain
    # test run replays the corpus on every platform; searching runs here, one job per test.
    name: Fuzz the ${{ matrix.target }} (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Random bytes: about 2 ms a run on a hosted runner, so an hour.
          - target: frontend
            runs: 2M
          - target: runtime
            runs: 2M
          # Generated programs run whole through the front end or the VM: about 25 ms a run.
          - target: frontend_programs
            runs: 200K
          - target: runtime_programs
            runs: 200K
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          zig-version-file: .tool-versions

      - name: Fuzz
        working-directory: core
        # A crash `--fuzz` finds is reported but leaves the exit code 0 (Zig 0.17 counts only
        # the steps before fuzzing), so the input it saves is what fails the job. One the cache
        # brought back is an earlier run's, so it goes first.
        run: |
          crash="${ZIG_LOCAL_CACHE_DIR:?}/f/crash"
          rm -f "$crash"
          zig build fuzz -Dfuzz-target=${{ matrix.target }} --fuzz=${{ matrix.runs }}
          if [ -e "$crash" ]; then
            echo "::error::The fuzzer found a crash; its input is in the fuzz-crash-${{ matrix.target }} artifact"
            exit 1
          fi

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          # setup-zig points Zig's cache at the checkout's root, not core/.
          path: ${{ env.ZIG_LOCAL_CACHE_DIR }}/f/
          if-no-files-found: ignore

  gc-stress:
    # Every test with every VM collecting at each object allocation: a value a native or
    # the VM forgot to root is swept at once and the test fails where it is used.
    name: Tests under GC stress (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          zig-version-file: .tool-versions

      - name: Setup `wasmtime`
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Run the tests
        working-directory: core
        run: zig build test -Doptimize=debug -Dgc-stress --summary line

      - name: Run the wasm tests (32-bit pointers)
        working-directory: core
        run: zig build test-wasm -Dtarget=wasm32-wasi -Doptimize=debug -Dgc-stress --summary line

      # The threads build (shared memory, atomics) runs only here: its no-op std::mutex
      # (src/wasm_stubs.h) relies on Manifold staying serial in it.
      - name: Run the wasm tests (threads build)
        if: ${{ !cancelled() }}
        working-directory: core
        run: zig build test-wasm -Dtarget=wasm32-wasi -Doptimize=debug -Dwasm_threads=true --summary line
