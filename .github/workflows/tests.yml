name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debug, with UBSan on the C++ kernel.
          - name: linux debug
            os: ubuntu-latest
            core_task: test:core
            wasm_task: test:wasm
          # The mode the released binaries are built in, which nothing tested.
          - name: linux release-safe
            os: ubuntu-latest
            core_task: test:core:safe
            wasm_task: test:wasm:safe
          # Apple arm64: allocator, unwinding and libc differ from Linux.
          - name: macos debug
            os: macos-latest
            core_task: test:core
            wasm_task: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          version: '^11.25'
          runtime: node@24
          cache: true

      - name: Install Zig
        uses: xyzzylabs/setup-zig@v1
        with:
          zig-version-file: .tool-versions

      - name: Setup `wasmtime`
        if: matrix.wasm_task != ''
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Run `wasmtime version`
        if: matrix.wasm_task != ''
        run: "wasmtime --version"

      - name: Run lib tests
        run: pnpm ${{ matrix.core_task }}

      - name: Check the fuzz corpus is formatted and lint-clean
        if: matrix.core_task == 'test:core'
        run: pnpm check:examples

      - name: Validate exported glTF with the Khronos validator
        if: matrix.name == 'linux debug'
        run: |
          pnpm install --frozen-lockfile --filter kupcad
          pnpm check:gltf

      - name: Run wasm tests
        if: matrix.wasm_task != ''
        run: pnpm ${{ matrix.wasm_task }}
