name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # The front ends (packages/): oxlint, oxfmt and tsc over every package, then their tests,
  # @kupcad/wasm's against the module built from this commit.
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: packages-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: '^12.15'
          node-version-file: .tool-versions
          cache: true

      - name: Install Zig
        uses: xyzzylabs/setup-zig@2082e552e19803253444ed0f0124948d16e9a926 # v1.0.6
        with:
          zig-version-file: .tool-versions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, format and type-check
        run: pnpm check

      - name: Build kupcad.wasm and the packages
        run: |
          pnpm build:core:wasm
          pnpm -r build

      - name: Run the packages' tests
        run: pnpm test:packages

      # Chromium for the browser tests, kept between runs while Playwright's version is the same
      - name: Read Playwright's version
        id: playwright
        run: echo "version=$(pnpm --filter @kupcad/ui exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The viewer drawn by headless Chromium's WebGL, the model made by the core in the page.
      # A cached Chromium still needs the system's libraries, which the runner doesn't keep
      - name: Run the packages' browser tests
        env:
          CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHED" = true ]; then
            pnpm --filter @kupcad/ui exec playwright install-deps chromium
          else
            pnpm --filter @kupcad/ui exec playwright install --with-deps chromium
          fi
          pnpm test:browser

  # libkupcad, the core as a C library (core/include/kupcad.h), under the Ruby gem and the
  # Python package (bindings/): each one's tests on the library built from this commit, and its
  # lint, on each system. The C API's own tests run with the core's (core/src/capi_test.zig);
  # the release tests each platform's gem and wheel, installed, on that platform.
  bindings:
    name: Bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: bindings-${{ matrix.os }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # The bindings' LICENSE is a link to the repository's: Git on Windows checks a link out as
      # a file holding its target, unless told to make links
      - name: Check links out as links
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Zig
        uses: xyzzylabs/setup-zig@2082e552e19803253444ed0f0124948d16e9a926 # v1.0.6
        with:
          zig-version-file: .tool-versions

      # ReleaseSafe, as the release builds it: the examples the bindings build run at its speed
      - name: Build libkupcad
        working-directory: core
        run: zig build lib -Doptimize=ReleaseSafe

      - name: Install Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          working-directory: bindings/ruby
          bundler-cache: true

      # The specs, RuboCop and the RBS signatures
      - name: Test and lint the Ruby gem
        working-directory: bindings/ruby
        run: bundle exec rake

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .tool-versions

      # The virtualenv's Python is in bin/, or Scripts\ on Windows
      - name: Test and lint the Python package
        working-directory: bindings/python
        run: |
          python -m venv .venv
          python=.venv/bin/python
          if [ "$RUNNER_OS" = Windows ]; then python=.venv/Scripts/python.exe; fi
          "$python" -m pip install -e . --group dev
          "$python" -m pytest
          "$python" -m ruff check
          "$python" -m ruff format --check
          "$python" -m mypy

  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        # pnpm's scripts and the steps below are POSIX shell: Git Bash on Windows
        shell: bash
    concurrency:
      group: test-${{ github.workflow }}-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debug, with UBSan on the C++ kernel.
          - name: linux debug
            os: ubuntu-latest
            core_task: test:core
            wasm_task: test:wasm
          # The mode the released binaries are built in, which nothing tested.
          - name: linux release-safe
            os: ubuntu-latest
            core_task: test:core:safe
            wasm_task: test:wasm:safe
          # Apple arm64: allocator, unwinding and libc differ from Linux.
          - name: macos debug
            os: macos-latest
            core_task: test:core
            wasm_task: ""
          # Windows, in the mode its release is built in: drive letters in file URIs, the
          # profile folder, the console, processes. Cross-compiled on Linux, the tests weren't
          # run, and its SDK's headers (named in any case) weren't found.
          - name: windows release-safe
            os: windows-latest
            core_task: test:core:safe
            wasm_task: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: '^12.15'
          node-version-file: .tool-versions
          cache: true

      - name: Install Zig
        uses: xyzzylabs/setup-zig@2082e552e19803253444ed0f0124948d16e9a926 # v1.0.6
        with:
          zig-version-file: .tool-versions

      - name: Setup `wasmtime`
        if: matrix.wasm_task != ''
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
      - name: Run `wasmtime version`
        if: matrix.wasm_task != ''
        run: "wasmtime --version"

      - name: Run lib tests
        run: pnpm ${{ matrix.core_task }}

      - name: Check the fuzz corpus is formatted and lint-clean
        if: matrix.core_task == 'test:core'
        run: pnpm check:examples

      - name: Validate exported glTF with the Khronos validator
        if: matrix.name == 'linux debug'
        run: |
          pnpm install --frozen-lockfile --filter kupcad
          pnpm check:gltf

      - name: Install Python
        if: matrix.name == 'linux debug'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .tool-versions
          cache: pip
          cache-dependency-path: core/scripts/requirements.txt

      # lib3mf is the 3MF Consortium's library: its strict reader refuses what the format
      # doesn't allow, and its warnings fail the check too.
      - name: Validate exported 3MF with lib3mf
        if: matrix.name == 'linux debug'
        run: |
          pip install -r core/scripts/requirements.txt
          pnpm check:3mf

      # ezdxf's recovering reader and auditor: an error, or anything it had to fix, fails
      # the check; an SVG must be well-formed XML with a path per shape.
      - name: Validate exported SVG and DXF
        if: matrix.name == 'linux debug'
        run: pnpm check:drawings

      # The protocol package's tests read the headers the core's preview worker sent: captured
      # again from this build, they are what is committed, or the protocol changed without them
      - name: Check the protocol fixtures are what the core sends
        if: matrix.name == 'linux debug'
        run: |
          pnpm install --frozen-lockfile --filter kupcad --filter '@kupcad/protocol...'
          pnpm --filter @kupcad/protocol fixtures
          git diff --exit-code packages/kupcad-protocol/src/fixtures

      # The desktop app's page and its server on the real kupcad lsp, the one check:examples
      # built: the handshake, a script's diagnostics, and its model from the viewport socket
      - name: Run the desktop app on the real kupcad lsp
        if: matrix.name == 'linux debug'
        run: |
          pnpm install --frozen-lockfile --filter '@kupcad/desktop...'
          pnpm --filter @kupcad/desktop test:integration

      # The VS Code extension in a real VS Code (the newest stable, downloaded), on the same kupcad
      # lsp: its diagnostics, formatting and hover, and the viewer opening; xvfb gives it a display.
      # Then packed as a release packs it, so what the Marketplace refuses fails here, not at a tag
      - name: Run the VS Code extension in VS Code on the real kupcad lsp
        if: matrix.name == 'linux debug'
        run: |
          pnpm install --frozen-lockfile --filter 'kupcad-vscode...'
          pnpm --filter kupcad-vscode build
          xvfb-run -a pnpm --filter kupcad-vscode test:integration
          pnpm --filter kupcad-vscode package

      # The desktop app's native side, on the kupcad check:examples built as its sidecar: macOS
      # needs no WebKit packages to build it
      - name: Lint and test the desktop app's native side
        if: matrix.name == 'macos debug'
        run: |
          rustup toolchain install "$(awk '$1 == "rust" { print $2 }' .tool-versions)" --profile minimal --component clippy
          rustup default "$(awk '$1 == "rust" { print $2 }' .tool-versions)"
          pnpm install --frozen-lockfile --filter '@kupcad/desktop...'
          pnpm --filter @kupcad/desktop build
          pnpm --filter @kupcad/desktop sidecar
          cd packages/kupcad-desktop/src-tauri
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Run wasm tests
        if: matrix.wasm_task != ''
        run: pnpm ${{ matrix.wasm_task }}
