version: 2
updates:
  # Keeps the SHA-pinned actions current (the comment after each SHA names the release)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  # The Ruby gem's development tools (bindings/ruby/Gemfile.lock)
  - package-ecosystem: bundler
    directory: /bindings/ruby
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      development:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Matches npmMinimalAgeGate in pnpm config
    cooldown:
      default-days: 3
    # The VS Code API's types are those of the oldest VS Code the extension runs on (its
    # engines.vscode): they move with it, by hand, or the Marketplace refuses the extension
    ignore:
      - dependency-name: '@types/vscode'
    groups:
      development:
        dependency-type: development
